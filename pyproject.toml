[project]
name = "android-updater"
version = "0.1.0"
description = "Update F-Droid apps on a USB-connected Android phone via adb"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
android-updater = "android_updater.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/android_updater"]
